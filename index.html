<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Primo Mercato · Generatore volantini</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style id="ps"></style>
<style>
:root{--p:#8A1C8C;--pd:#4F0E52;--y:#FFEE00;--m:#7CD1B0;--ink:#2A1330;--bg:#F1EBF5;--line:#E6DCEC}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.4 'DM Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column}
:focus-visible{outline:3px solid var(--m);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
.top{flex:none;height:60px;background:#fff;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line)}
.top img{height:40px}.top strong{font:600 16px Fredoka,sans-serif;color:var(--p)}.sp{flex:1}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;background:#F1EBF5;color:var(--pd)}
.btn:hover{background:#E6DCEC}.btn.p{background:var(--p);color:#fff}.btn.p:hover{background:var(--pd)}
.btn.s{padding:5px 10px;font-size:12px}.btn:disabled{opacity:.6;cursor:wait}.xp .page{box-shadow:none}
.main{flex:1;min-height:0;display:grid;grid-template-columns:410px 1fr}
aside{background:#fff;overflow:auto;padding:18px;border-right:1px solid var(--line)}
.sg{display:flex;gap:4px;background:#F1EBF5;padding:4px;border-radius:12px}
.sg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:9px;font-weight:600;cursor:pointer}
.sg .on{background:#fff;color:var(--p);box-shadow:0 1px 3px #0003}
.tabs{margin-bottom:18px}
section.f{margin-bottom:20px}
h4{margin:0 0 8px;font:600 15px Fredoka,sans-serif;color:var(--pd)}
label{display:block;font-size:12px;font-weight:600;margin:10px 0 4px;color:#5d4a66}
input[type=text],input[type=number],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff}
textarea{resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.sw{display:flex;align-items:center;gap:10px;margin:12px 0 0;font-size:14px;font-weight:400;color:var(--ink)}
.sw input{accent-color:var(--p);width:18px;height:18px}
.box{background:#F8F4FA;border-radius:14px;padding:14px;margin-bottom:16px}
.pi{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:#fff;border:1px solid var(--line);margin-bottom:8px}
.pi img{width:44px;height:44px;object-fit:contain;border-radius:8px;background:#F8F4FA}
.pi div{flex:1;min-width:0}.pi b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi small{color:#6b5a74}.pi button{border:0;background:none;color:var(--p);font-weight:600;cursor:pointer;padding:4px}
#pv{overflow:auto;padding:16px 28px 40px;display:flex;flex-direction:column;align-items:center}
.bar{width:100%;display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.bar span{font-size:13px;color:#5d4a66}.warn{color:#b3261e!important;font-weight:600}
#pa{display:flex;flex-direction:column;align-items:center;gap:24px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--pd);color:#fff;padding:10px 16px;border-radius:12px;transition:.25s;z-index:9}
#toast.on{transform:translateX(-50%)}
[hidden]{display:none!important}

/* ===== VOLANTINO: tutte le misure sono relative alla pagina (cqw) o al riquadro (cqmin) ===== */
.page{flex:none;background:#fff;container-type:size;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 32px #4F0E5233}
.hd{position:relative;flex:none;overflow:hidden;background:#fff}
.hd.bg{height:30cqw}.hd.sm{height:14cqw}
.bl{position:absolute;right:0;top:0;height:100%;width:66%}.bl path{fill:var(--p)}
.lg{position:absolute;left:4cqw;top:50%;transform:translateY(-50%);height:calc(78% * var(--ls,1));width:auto}
.o1,.o2{position:absolute;border-radius:50%}
.o1{left:51cqw;bottom:-4cqw;width:9cqw;height:9cqw;background:var(--y)}
.o2{left:57cqw;top:3cqw;width:3.4cqw;height:3.4cqw;background:var(--m)}
.sm .o1,.sm .o2{display:none}
.tt{position:absolute;right:4cqw;top:50%;transform:translateY(-50%);width:31cqw;color:#fff}
.tt h2{margin:0 0 1.8cqw;font:700 6cqw/1.02 Fredoka,sans-serif}
.pl{display:inline-block;background:var(--y);color:var(--p);font:700 2.2cqw Fredoka,sans-serif;padding:.8cqw 2.2cqw;border-radius:9cqw}
.sm .tt h2{font-size:3.2cqw;margin-bottom:.8cqw}.sm .pl{font-size:1.7cqw;padding:.4cqw 1.6cqw}
.gr{flex:1;min-height:0;display:grid;gap:2.2cqw;padding:3cqw 4cqw}
.t{position:relative;container-type:size;background:var(--c);border-radius:2.4cqw;overflow:hidden;min-height:0}
.in{position:absolute;inset:0;padding:6cqmin;display:flex;flex-direction:column;gap:3cqmin}
.cat{position:absolute;top:5cqmin;left:5cqmin;z-index:1;background:#ffffffb3;color:var(--pd);font-weight:700;font-size:4.8cqmin;padding:1.2cqmin 3cqmin;border-radius:9cqmin}
.im{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin-top:7cqmin}
.im img{max-width:100%;max-height:100%;object-fit:contain;border-radius:5cqmin;filter:drop-shadow(0 .8cqmin 1.2cqmin #4F0E5233)}
.tx{display:flex;flex-direction:column;gap:2cqmin;max-width:60%}
.nm{margin:0;font-weight:700;font-size:7cqmin;line-height:1.15;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:var(--pd)}
.cd{align-self:flex-start;background:#fff;color:var(--p);font-weight:700;font-size:4.4cqmin;padding:.8cqmin 2.6cqmin;border-radius:9cqmin}
.nc .im{margin-top:0}.old{font-size:5.4cqmin;opacity:.65}
.dc{position:absolute;top:4cqmin;right:4cqmin;width:17cqmin;height:17cqmin;border-radius:50%;background:var(--m);color:var(--pd);display:grid;place-items:center;font:700 5.4cqmin Fredoka,sans-serif;transform:rotate(8deg)}
.pr{position:absolute;right:4cqmin;bottom:4cqmin;width:38cqmin;height:38cqmin;border-radius:50%;background:var(--y);color:var(--p);display:grid;place-items:center;font-family:Fredoka,sans-serif;font-weight:700}
.pr span{display:flex;align-items:flex-start;line-height:1;padding-right:1cqmin}
.pr small{font-size:7cqmin;margin-top:1.5cqmin}.pr b{font-size:16cqmin}.pr sup{font-size:8.5cqmin;margin-top:1.5cqmin}
@container (min-aspect-ratio:6/5){
 .in{flex-direction:row;align-items:stretch;gap:4cqmin}
 .im{flex:0 0 46%;margin-top:0}
 .tx{flex:1;max-width:none;justify-content:center;padding-bottom:10cqmin}
 .nm{font-size:8cqmin}.cat{left:auto;right:auto;top:5cqmin;left:5cqmin}
}
.ft{flex:none;background:var(--p);color:#fff;padding:2.4cqw 4cqw 2cqw;display:grid;grid-template-columns:1fr auto auto;gap:1.2cqw 3cqw;align-items:center}
.fl{display:flex;flex-direction:column;gap:.8cqw}
.site{font:700 3.6cqw Fredoka,sans-serif;color:var(--y)}
.inf{font-size:1.8cqw;line-height:1.35}
.qrs{display:flex;gap:2cqw}
.qb{display:flex;flex-direction:column;align-items:center;gap:.5cqw;width:10.5cqw}
.qc{background:#fff;border-radius:1cqw;padding:.8cqw;width:9cqw;height:9cqw}.qc svg{display:block;width:100%;height:100%}
.qb small{font-size:1.3cqw;line-height:1.2;text-align:center;display:flex;flex-direction:column;word-break:break-all}.qb b{color:var(--y)}
.pg{background:var(--m);color:var(--pd);border-radius:50%;width:5.6cqw;height:5.6cqw;display:grid;place-items:center;font:700 1.9cqw Fredoka,sans-serif}
.lg2{grid-column:1/-1;margin:0;font-size:1.4cqw;opacity:.75;line-height:1.3}

.main>*{min-width:0}input[type=file]{max-width:100%}
@media(max-width:900px){
 html,body{height:auto;min-height:100%;overflow-x:hidden}
 .main{display:block;overflow:visible}
 aside{border:0;overflow:visible;padding:14px;width:100%}
 #pv{overflow-x:auto;padding:12px 12px 32px;width:100%}
 .top{height:auto;flex-wrap:wrap;padding:8px 12px;gap:8px}.top strong{display:none}.top img{height:32px}
 .btn{padding:8px 10px}
 .g3{grid-template-columns:1fr 1fr}.g3>div:first-child{grid-column:1/-1}
 .bar .sp{display:none}
 input,select,textarea{font-size:16px}
}
@media print{
 html,body{height:auto;background:#fff;display:block}
 .top,aside,.bar,#toast{display:none!important}
 .main,#pv,#pa{display:block;overflow:visible;padding:0;background:none}
 .page{width:var(--mw)!important;height:var(--mh)!important;margin:0!important;box-shadow:none!important;break-after:page}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header class="top">
  <img id="tl" alt="Primo Mercato"><strong>Generatore volantini</strong><div class="sp"></div>
  <button class="btn" id="bk">Backup</button>
  <label class="btn" style="margin:0;font-size:14px;color:var(--pd)">Carica<input type="file" id="ji" accept=".json" hidden></label>
  <button class="btn p" id="dl" onclick="dlPdf()">Scarica PDF</button>
</header>
<div class="main">
<aside>
  <div class="sg tabs"><button data-t="a" class="on">Volantino</button><button data-t="b">Prodotti (<span id="cnt">0</span>)</button></div>

  <div id="ta">
    <section class="f"><h4>Formato</h4>
      <div class="sg">
        <button data-k="fmt" data-v="A4">A4</button><button data-k="fmt" data-v="A3">A3</button>
        <button data-k="fmt" data-v="50x70">50×70</button><button data-k="fmt" data-v="70x100">70×100</button>
      </div>
      <div id="gp"><label>Pagine</label>
        <div class="sg"><button data-k="pages" data-v="0">Auto</button><button data-k="pages" data-v="2">2</button><button data-k="pages" data-v="4">4</button><button data-k="pages" data-v="6">6</button><button data-k="pages" data-v="8">8</button></div>
      </div>
      <label>Prodotti per pagina</label>
      <div class="sg"><button data-k="per" data-v="4">4</button><button data-k="per" data-v="6">6</button><button data-k="per" data-v="8">8</button><button data-k="per" data-v="12">12</button><button data-k="per" data-v="16">16</button><button data-k="per" data-v="20">20</button></div>
      <label class="sw"><input type="checkbox" data-k="group"> Raggruppa per categoria</label>
      <label class="sw"><input type="checkbox" data-k="showCat"> Mostra categoria sui prodotti</label>
      <label class="sw"><input type="checkbox" data-k="showPg"> Mostra numero di pagina</label>
    </section>
    <section class="f"><h4>Logo</h4>
      <div style="display:flex;align-items:center;gap:10px"><img id="lp" alt="" style="height:44px;max-width:140px;object-fit:contain;background:#F8F4FA;border-radius:8px;padding:4px"><label class="btn s" style="margin:0">Carica logo<input type="file" id="lf" accept="image/*" hidden></label><button class="btn s" id="lr">Ripristina</button></div>
      <label>Dimensione</label><input type="range" min="50" max="110" step="5" data-k="logoSize" style="width:100%;accent-color:var(--p)">
    </section>
    <section class="f"><h4>Titolo e validità</h4>
      <label>Titolo</label><input type="text" data-k="title">
      <label>Periodo</label><input type="text" data-k="validity">
    </section>
    <section class="f"><h4>Negozio e note legali</h4>
      <label>Indirizzo e contatti</label><input type="text" data-k="address">
      <label>Servizi o orari</label><input type="text" data-k="info">
      <label>Note legali</label><textarea rows="3" data-k="legal"></textarea>
    </section>
    <section class="f"><h4>Sito e codici QR</h4>
      <label>Sito web (scritta nel piè e QR)</label><input type="text" data-k="site" placeholder="www.primomercato.it">
      <label class="sw"><input type="checkbox" data-k="qrWeb"> Mostra QR del sito</label>
      <label>Telefono WhatsApp (con prefisso)</label><input type="text" data-k="wa" placeholder="+39 333 1234567">
      <label class="sw"><input type="checkbox" data-k="qrWa"> Mostra QR WhatsApp (apre la chat)</label>
    </section>
  </div>

  <div id="tb" hidden>
    <div class="box">
      <h4>Aggiungi prodotti in blocco</h4>
      <input type="file" id="csv" accept=".csv,.txt">
      <p style="font-size:12px;margin:8px 0 10px;color:#5d4a66">Colonne: Titolo, Categoria, Prezzo regolare, Prezzo promo, Condizioni, URL foto. Separatore , o ;</p>
      <button class="btn s" id="demo">Carica esempio</button> <button class="btn s" id="tpl">Scarica modello CSV</button>
    </div>
    <div class="box">
      <h4 id="fh">Nuovo prodotto</h4>
      <label>Titolo *</label><input type="text" id="pt" placeholder="Es. Sunsilk shampoo 250ml">
      <label>Categoria</label><input type="text" id="pc" list="cats">
      <datalist id="cats"><option>Pulizia casa<option>Bucato<option>Igiene corpo<option>Cura capelli<option>Igiene orale<option>Make-up e profumi<option>Casalinghi<option>Carta e monouso<option>Solari</datalist>
      <div class="g3"><div><label>Condizioni</label><input type="text" id="pd" placeholder="Max 3 pezzi"></div><div><label>Prezzo €</label><input type="number" step="0.01" id="pr"></div><div><label>Promo € *</label><input type="number" step="0.01" id="pp"></div></div>
      <label>Foto (URL o file)</label>
      <div style="display:flex;gap:8px"><input type="text" id="pi" placeholder="https://…"><label class="btn s" style="margin:0;white-space:nowrap;display:grid;place-items:center">Carica<input type="file" id="pf" accept="image/*" hidden></label></div>
      <div style="display:flex;gap:8px;margin-top:14px"><button class="btn p" id="sv" style="flex:1">Salva prodotto</button><button class="btn" id="cl">Annulla</button></div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:10px"><input type="text" id="q" placeholder="Cerca nell'elenco"><button class="btn s" id="da">Svuota</button></div>
    <div id="pl"></div>
  </div>
</aside>
<main id="pv">
  <div class="bar"><span id="st"></span><span id="ov" class="warn"></span><div class="sp"></div>
    <button class="btn s" id="zm">−</button><button class="btn s" id="zf">Adatta</button><button class="btn s" id="zp">+</button></div>
  <div id="pa"></div>
</main>
</div>
<div id="toast"></div>

  for(const x of [...b.matchAll(/url\(['"]?(https:[^)'"]+)/g)]){const u=x[1];

 const y=layout(),W=1240,H=Math.round(W*y.h/y.w),box=document.createElement('div');
 box.className='xp';box.style.cssText='position:fixed;left:-99999px;top:0;width:'+W+'px';
 box.innerHTML=pagesHTML(y,W+'px',H+'px');document.body.appendChild(box);
 try{
  if(document.fonts)await document.fonts.ready;
  await Promise.all([...box.querySelectorAll('img')].map(i=>i.decode?i.decode().catch(()=>{}):0));
  let fe;try{fe=await fontCSS()}catch(e){toast('Font non scaricati: il PDF potrebbe avere font diversi')}
  const pages=box.querySelectorAll('.page'),o={quality:.92,pixelRatio:2,width:W,height:H,backgroundColor:'#fff',imagePlaceholder:PH,fontEmbedCSS:fe||undefined};
  await htmlToImage.toJpeg(pages[0],o);await htmlToImage.toJpeg(pages[0],o);
  const pdf=new jspdf.jsPDF({unit:'mm',format:[y.w,y.h],orientation:'p'});
  for(let i=0;i<pages.length;i++){const d=await htmlToImage.toJpeg(pages[i],o);if(i)pdf.addPage([y.w,y.h],'p');pdf.addImage(d,'JPEG',0,0,y.w,y.h)}
  pdf.save('volantino-primomercato-'+new Date().toISOString().slice(0,10)+'.pdf');toast('PDF scaricato');
 }catch(e){toast('Errore nella creazione del PDF')}
 finally{box.remove();btn.disabled=false;btn.textContent='Scarica PDF'}
}
function sync(){
 $$('[data-v]').forEach(b=>b.classList.toggle('on',String(cfg[b.dataset.k])==b.dataset.v));
 $('#gp').hidden=cfg.fmt!='A4';$('#lp').src=cfg.logo||LOGO;$('#cnt').textContent=prods.length;
}
function upd(){save();sync();render()}
function fields(){$$('[data-k]:not([data-v])').forEach(i=>i.type=='checkbox'?i.checked=!!cfg[i.dataset.k]:i.value=cfg[i.dataset.k])}

document.addEventListener('click',e=>{
 const b=e.target.closest('[data-v]');
 if(b){const k=b.dataset.k,v=isNaN(b.dataset.v)?b.dataset.v:+b.dataset.v;cfg[k]=v;if(k=='fmt')cfg.per=DPER[v];upd()}
 const t=e.target.closest('[data-t]');
 if(t){$$('[data-t]').forEach(x=>x.classList.toggle('on',x==t));$('#ta').hidden=t.dataset.t!='a';$('#tb').hidden=t.dataset.t!='b';if(t.dataset.t=='a')render()}
});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(!k||t.dataset.v)return;cfg[k]=t.type=='checkbox'?t.checked:t.type=='range'?+t.value:t.value;upd()});
document.addEventListener('error',e=>{if(e.target.tagName=='IMG'&&e.target.src!=PH&&!e.target.classList.contains('lg')){e.target.src=PH}},true);
$('#zm').onclick=()=>{z=Math.max(.5,z-.25);render()};$('#zp').onclick=()=>{z=Math.min(3,z+.25);render()};$('#zf').onclick=()=>{z=1;render()};
addEventListener('resize',()=>{clearTimeout(window._r);window._r=setTimeout(render,120)});

/* Prodotti */
function list(){
 const q=$('#q').value.toLowerCase(),L=prods.filter(p=>(p.title+p.cat).toLowerCase().includes(q));
 $('#pl').innerHTML=L.length?L.map(p=>`<div class="pi"><img src="${esc(p.img||PH)}" alt=""><div><b>${esc(p.title)}</b><small>${esc(p.cat)} · ${p.reg?'<s>€'+eur(p.reg)+'</s> ':''}<strong style="color:var(--p)">€${eur(p.promo)}</strong></small></div><button onclick="editP('${p.id}')">Modifica</button><button onclick="delP('${p.id}')">Elimina</button></div>`).join(''):'<p style="color:#6b5a74;text-align:center">Nessun prodotto. Aggiungine uno o importa un CSV.</p>';
}
function clr(){edit='';['pt','pr','pp','pd','pi'].forEach(i=>$('#'+i).value='');$('#pf').value='';$('#fh').textContent='Nuovo prodotto';$('#sv').textContent='Salva prodotto'}
function editP(id){const p=prods.find(x=>x.id==id);if(!p)return;edit=id;$('#pt').value=p.title;$('#pc').value=p.cat;$('#pr').value=p.reg||'';$('#pp').value=p.promo;$('#pd').value=p.cond;$('#pi').value=p.img.startsWith('data:')?'':p.img;$('#fh').textContent='Modifica prodotto';$('#sv').textContent='Aggiorna prodotto';$('#pt').focus()}
function delP(id){prods=prods.filter(p=>p.id!=id);list();upd();toast('Prodotto eliminato')}
$('#sv').onclick=()=>{
 const t=$('#pt').value.trim(),promo=parseFloat($('#pp').value);
 if(!t||isNaN(promo)){toast('Servono almeno titolo e prezzo promo');return}
 const old=prods.find(x=>x.id==edit),p=norm({id:edit||undefined,title:t,cat:$('#pc').value.trim()||'Pulizia casa',reg:$('#pr').value,promo,cond:$('#pd').value.trim(),img:$('#pi').value.trim()||(old&&old.img.startsWith('data:')?old.img:'')});
 edit?prods=prods.map(x=>x.id==edit?p:x):prods.push(p);
 clr();list();upd();toast('Prodotto salvato')};
$('#cl').onclick=clr;$('#q').oninput=list;
$('#da').onclick=()=>{if(confirm('Eliminare tutti i prodotti?')){prods=[];list();upd()}};
$('#demo').onclick=()=>{prods=demo();list();upd();toast('Esempio caricato: i prezzi promo sono inventati')};
$('#pf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas'),x=c.getContext('2d'),png=f.type=='image/png';c.width=i.width*k;c.height=i.height*k;if(!png){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(i,0,0,c.width,c.height);$('#pi').value=c.toDataURL(png?'image/png':'image/jpeg',.9)};i.src=r.result};r.readAsDataURL(f)};
const csvRows=t=>{const L=t.split(/\r?\n/).filter(x=>x.trim()),d=L[0].includes(';')?';':',';return L.map(l=>{const o=[];let c='',q=0;for(const ch of l){if(ch=='"')q=!q;else if(ch==d&&!q){o.push(c.trim());c=''}else c+=ch}o.push(c.trim());return o})};
$('#csv').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{let n=0;csvRows(t).forEach((c,i)=>{if(i==0&&/titolo/i.test(c[0])||c.length<4)return;prods.push(norm({title:c[0],cat:c[1],reg:String(c[2]).replace(',','.'),promo:String(c[3]).replace(',','.'),cond:c[4],img:c[5]}));n++});list();upd();toast(n+' prodotti importati')})};
$('#tpl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['Titolo;Categoria;Prezzo regolare;Prezzo promo;Condizioni;URL foto\nSunsilk shampoo 250ml;Cura capelli;1,95;1,29;Max 6 pezzi;\n'],{type:'text/csv'}));a.download='modello-prodotti.csv';a.click()};

$('#lf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cfg.logo=c.toDataURL('image/png');upd()};i.src=r.result};r.readAsDataURL(f)};
$('#lr').onclick=()=>{cfg.logo='';upd()};
/* Backup */
$('#bk').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({cfg,prods})],{type:'application/json'}));a.download='volantino-primomercato-'+new Date().toISOString().slice(0,10)+'.json';a.click()};
$('#ji').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{
 const d=JSON.parse(t),c=d.config||d.cfg||{},M={storeAddress:'address',storeHours:'info',storeNotes:'site',legalDisclaimer:'legal',docType:'fmt',pageCount:'pages',itemsPerPage:'per',autoSortCategory:'group'};
 Object.keys(M).forEach(o=>{if(o in c)c[M[o]]=c[o]});
 cfg={...D,...c};if(!COLS[cfg.per])cfg.per=8;if(!F[cfg.fmt])cfg.fmt='A4';
 prods=(d.products||d.prods).map(norm);fields();list();upd();toast('Dati caricati')}catch(x){toast('File non valido')}})};

$('#tl').src=LOGO;fields();list();sync();render();
</script>
</body>
</html>
